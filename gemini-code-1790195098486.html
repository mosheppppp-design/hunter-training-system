<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>Hunter Training System</title>
    <style>
        body { background: #121212; color: #fff; font-family: Arial, sans-serif; text-align: center; padding: 20px; }
        .card { background: #1e1e1e; padding: 15px; margin: 10px auto; border-radius: 10px; max-width: 400px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        button { background: #00adb5; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-size: 16px; }
        button:hover { background: #00818a; }
    </style>
</head>
<body>

    <h1>🎮 Hunter Status</h1>
    <div class="card">
        <h2>דרגה: <span id="level">1</span></h2>
        <p>XP: <span id="xp">0</span> / 1000</p>
        <button onclick="addXP(100)">קבל +100 XP 🎯</button>
    </div>

    <div class="card">
        <h3>משימות שבועיות (300/300/300)</h3>
        <p>מתח: <span id="pullups">0</span>/300</p>
        <button onclick="addPullups(50)">בצע 50 מתח 💪</button>
    </div>

    <script>
        let xp = localStorage.getItem('hunter_xp') ? parseInt(localStorage.getItem('hunter_xp')) : 0;
        let level = localStorage.getItem('hunter_level') ? parseInt(localStorage.getItem('hunter_level')) : 1;
        let pullups = localStorage.getItem('hunter_pullups') ? parseInt(localStorage.getItem('hunter_pullups')) : 0;

        function updateUI() {
            document.getElementById('xp').innerText = xp;
            document.getElementById('level').innerText = level;
            document.getElementById('pullups').innerText = pullups;
        }

        function addXP(amount) {
            xp += amount;
            if (xp >= 10000) { level++; xp = 0; }
            localStorage.setItem('hunter_xp', xp);
            localStorage.setItem('hunter_level', level);
            updateUI();
        }

        function addPullups(amount) {
            pullups += amount;
            if(pullups > 300) pullups = 300;
            localStorage.setItem('hunter_pullups', pullups);
            addXP(100);
            updateUI();
        }

        updateUI();
    </script>
</body>
</html>
